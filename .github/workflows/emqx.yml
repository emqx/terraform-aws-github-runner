name: Deploy runners for EMQX organization
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 0'

jobs:
  lambdas:
    name: Build lambdas
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build lambdas dist
        env:
          OUTPUT_DIR: lambda_output
        run: .ci/build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambdas
          path: lambda_output/*.zip
          retention-days: 7

  ami:
    name: Build AMI
    runs-on: ubuntu-latest
    container:
      image: index.docker.io/hashicorp/packer@sha256:297bbbbbbf3ce9e0431ac1e8f02934b20e1197613f877b55dfdb1ebfd94eb748 # ratchet:index.docker.io/hashicorp/packer:1.8.6
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build AMI
        working-directory: images/ubuntu-jammy-${{ matrix.arch }}
        env:
          AWS_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          packer init .
          packer build .

  deploy:
    name: Deploy
    needs:
      - ami
      - lambdas
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.10.1

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambdas
          path: lambda_output/
      - name: Generate emqx.tfvars
        working-directory: examples/ephemeral-multiarch-prebuilt
        run: |
          cat <<EOF > emqx.tfvars
          github_app = {
            id         = ${{ secrets.APP_ID }}
            key_base64 = "${{ secrets.APP_KEY_BASE64 }}"
          }
          aws_region  = "eu-west-1"
          environment = "ci-eu"
          cleanup_org_runners = {
            state = "ENABLED"
            config = {
              githubOrgOwner = "emqx"
            }
          }
          EOF
      - name: Deploy
        working-directory: examples/ephemeral-multiarch-prebuilt
        env:
          AWS_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ls -al ../../lambda_output
          terraform init
          terraform refresh -var-file ./emqx.tfvars
          terraform apply -auto-approve -var-file ./emqx.tfvars

  ami-gc:
    name: Deregister oldest AMI
    runs-on: ubuntu-latest
    needs:
      - ami
      - deploy
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Deregister oldest AMI
        env:
          AWS_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          AMI_IDS=$(aws ec2 describe-images \
            --filters "Name=name,Values=github-runner-ubuntu-jammy-${{ matrix.arch }}-*" \
            --query 'sort_by(Images, &CreationDate)[*].[ImageId]' \
            --output text)
          # keep at least one AMI: the only image is the one currently in use
          if [ "$(echo "$AMI_IDS" | grep -c .)" -le 1 ]; then
            echo "One or zero AMIs present, nothing to deregister"
            exit 0
          fi
          AMI_ID=$(echo "$AMI_IDS" | head -n 1)
          aws ec2 deregister-image --image-id $AMI_ID
          aws ec2 describe-snapshots \
            --filters "Name=description,Values=*$AMI_ID*" \
            --query 'Snapshots[*].[SnapshotId]' \
            --output text | xargs aws ec2 delete-snapshot --snapshot-id
